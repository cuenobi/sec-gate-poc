name: sec-gate-poc

services:
  sonarqube:
    image: mc1arke/sonarqube-with-community-branch-plugin:26.10.0.133078-community
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?run scripts/sonar-bootstrap.sh}
      # Local only: Docker Desktop's VM may not have vm.max_map_count=524288; the cluster sets it.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?run scripts/sonar-bootstrap.sh}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube"]
      interval: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  sonarqube_data:
  db_data:
